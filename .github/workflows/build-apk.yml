name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Build debug APK
        working-directory: app
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug
          else gradle assembleDebug; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioCapture-debug
          path: app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Debug APK built from latest main commit.
          files: app/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true
